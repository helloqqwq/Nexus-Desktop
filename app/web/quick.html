<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>NexusQuick</title>
  <style>
    :root {
      --ink: #0f1115; --text: #1b1f27; --muted: #8a94a6;
      --line: #e5e8ef; --accent: #4176e6; --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden;
      font: 13px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif; color: var(--text); }
    body { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex: 1; }
    #qi {
      flex: 1; min-width: 0; height: 38px; border: none; outline: none; background: transparent;
      font-size: 14px; color: var(--text);
    }
    #qi::placeholder { color: var(--muted); }
    .btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
      background: #fff; color: var(--muted); display: grid; place-items: center; cursor: pointer;
      flex: 0 0 34px; transition: background .15s, color .15s, border-color .15s;
    }
    .btn:hover { background: #f4f6fb; color: var(--text); }
    .btn svg { width: 17px; height: 17px; }
    .btn.rec { background: var(--accent); border-color: var(--accent); color: #fff; }
    .shot { position: relative; width: 38px; height: 38px; flex: 0 0 38px;
      border-radius: 9px; border: 1px solid var(--line); }
    .shot[hidden] { display: none; }
    .shot img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
    .shot-del { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px;
      border-radius: 50%; border: none; padding: 0; background: #1b1f27; color: #fff;
      font: 12px/16px "Microsoft YaHei UI", sans-serif; cursor: pointer; }
    .send {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent);
      color: #fff; display: grid; place-items: center; cursor: pointer; flex: 0 0 36px;
    }
    .send:disabled { background: #c7d4ee; cursor: default; }
    .send svg { width: 18px; height: 18px; }
    .foot { padding: 0 14px 9px; color: var(--muted); font-size: 11.5px; display: flex;
      justify-content: space-between; align-items: center; gap: 10px; }
    .foot kbd { font: inherit; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
    .wave { display: flex; align-items: center; gap: 2px; height: 14px; }
    .wave[hidden] { display: none; }
    .wave i {
      width: 2px; height: 3px; border-radius: 1px; background: var(--accent);
      opacity: .85; transition: height .09s linear;
    }
    body.recording #qi { color: var(--muted); }
    .progress { height: 3px; flex: 0 0 3px; background: #eef2f8; overflow: hidden; }
    .progress[hidden] { display: none; }
    .progress i { display: block; height: 100%; width: 0; background: var(--accent);
      transition: width .2s linear; }
    #hint.warn { color: #c2410c; }
    #hint.ok { color: #15803d; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="shot" id="shotBox" hidden>
      <img id="shotImg" alt="截图">
      <button class="shot-del" id="shotDel" title="移除截图">×</button>
    </div>
    <input id="qi" autocomplete="off" spellcheck="false" data-i18n-placeholder="问我任何事…" placeholder="问我任何事…">
    <button class="btn" id="micBtn" data-i18n-title="语音输入（再按结束）" title="语音输入（再按结束）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
      </svg>
    </button>
    <button class="btn" id="shotBtn" data-i18n-title="截图提问" title="截图提问">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M8 5l1.2-2h5.6L16 5"/>
      </svg>
    </button>
    <button class="send" id="sendBtn" data-i18n-title="发送（Enter）" title="发送（Enter）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M6 11l6-6 6 6"/>
      </svg>
    </button>
  </div>
  <div class="progress" id="voiceProg" hidden><i id="voiceProgBar"></i></div>
  <div class="foot"><span id="hint" data-i18n="Enter 发送 · Esc 关闭">Enter 发送 · Esc 关闭</span><span class="wave" id="wave" hidden>
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </span></div>
  <script src="assets/i18n.js"></script>
  <script>
    (function () {
      var T = function (s) { return window.NexusI18n ? window.NexusI18n.t(s) : s; };
      var TF = function (s, v) { return window.NexusI18n ? window.NexusI18n.tf(s, v) : s; };
      var input = document.getElementById('qi');
      var sendBtn = document.getElementById('sendBtn');
      var micBtn = document.getElementById('micBtn');
      var shotBtn = document.getElementById('shotBtn');
      var hint = document.getElementById('hint');
      var wave = document.getElementById('wave');
      var bars = wave.querySelectorAll('i');
      var shotBox = document.getElementById('shotBox');
      var shotImg = document.getElementById('shotImg');
      var shotDel = document.getElementById('shotDel');
      var voiceProg = document.getElementById('voiceProg');
      var voiceProgBar = document.getElementById('voiceProgBar');
      var busy = false;
      var shot = null;
      var hintTimer = null;

      function api() { return window.pywebview && window.pywebview.api; }
      function call(name, a, b) {
        var p = api();
        if (!p || !p[name]) return Promise.resolve(null);
        try { return a === undefined ? p[name]() : p[name](a, b); }
        catch (e) { return Promise.resolve(null); }
      }

      function baseHint() {
        return shot ? T('已截图，输入问题后发送') : T('Enter 发送 · Esc 关闭');
      }

      function sync() { sendBtn.disabled = busy || (!input.value.trim() && !shot); }

      function setShot(dataUrl, b64) {
        shot = b64 ? { b64: b64, url: dataUrl || ('data:image/png;base64,' + b64) } : null;
        if (shot) {
          shotImg.src = shot.url;
          shotBox.hidden = false;
        } else {
          shotImg.removeAttribute('src');
          shotBox.hidden = true;
        }
        if (voiceProg.hidden) setHint(baseHint());
        sync();
      }

      function setHint(text, kind) {
        if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
        hint.textContent = text;
        hint.classList.toggle('warn', kind === 'warn');
        hint.classList.toggle('ok', kind === 'ok');
      }

      function flashHint(text, kind, ms) {
        setHint(text, kind);
        hintTimer = setTimeout(function () { setHint(baseHint()); }, ms || 2600);
      }

      function setProgress(percent) {
        if (percent === null || percent === undefined) {
          voiceProg.hidden = true;
          voiceProgBar.style.width = '0%';
          return;
        }
        voiceProg.hidden = false;
        voiceProgBar.style.width = Math.max(0, Math.min(100, percent)) + '%';
      }

      function syncVoice() {
        call('voice_status').then(function (res) {
          if (!res) return;
          if (res.downloading) {
            setHint(T('语音模型正在下载，请稍候…'), 'warn');
          } else if (!res.ready && !shot && !input.value.trim()) {
            setHint(T('语音模型未下载，点击麦克风开始下载'), 'warn');
          }
        });
      }

      shotDel.addEventListener('click', function () { setShot(null); input.focus(); });
      input.addEventListener('input', sync);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        if (e.key === 'Escape') { e.preventDefault(); call('quick', 'hide'); }
      });
      input.addEventListener('focus', function () { document.body.classList.add('focus'); });

      function send() {
        var text = input.value.trim();
        if ((!text && !shot) || busy) return;
        busy = true; sync();
        call('quick', 'send', { text: text, image: shot ? shot.b64 : '' }).then(function (res) {
          if (res && res.ok) { input.value = ''; setShot(null); }
          busy = false; sync();
        });
      }
      sendBtn.addEventListener('click', send);
      micBtn.addEventListener('click', function () {
        call('quick', 'voice').then(function (res) {
          if (res && res.ok === false && res.error) {
            flashHint(res.error, 'warn', 5000);
          }
        });
      });
      shotBtn.addEventListener('click', function () { call('quick', 'shot'); });

      window.NexusQuick = {
        onEvent: function (evt) {
          if (!evt) return;
          if (evt.type === 'voice_state') {
            if (evt.target === 'main') return;
            if (evt.downloading) {
              setProgress(evt.percent || 0);
              setHint(TF('语音模型未就绪，正在下载 {p}%', { p: evt.percent || 0 }), 'warn');
              return;
            }
            if (Object.prototype.hasOwnProperty.call(evt, 'ready')) {
              setProgress(null);
              if (evt.ready) {
                flashHint(T('语音模型已就绪，请再按一次麦克风'), 'ok', 5000);
              } else {
                flashHint(T('语音模型下载失败，请检查网络后重试'), 'warn', 6000);
              }
              return;
            }
            if (evt.error) {
              setProgress(null);
              flashHint(evt.error, 'warn', 5000);
              return;
            }
            if (evt.empty) {
              setProgress(null);
              flashHint(T('没有识别到内容'), 'warn', 3000);
              return;
            }
            if (evt.busy) {
              setProgress(null);
              micBtn.classList.remove('rec');
              document.body.classList.remove('recording');
              wave.hidden = true;
              bars.forEach(function (b) { b.style.height = '3px'; });
              setHint(T('正在识别…'));
              return;
            }
            var rec = !!evt.recording;
            micBtn.classList.toggle('rec', rec);
            document.body.classList.toggle('recording', rec);
            setHint(rec ? T('正在录音') : baseHint());
            wave.hidden = !rec;
            if (!rec) bars.forEach(function (b) { b.style.height = '3px'; });
          }
          if (evt.type === 'voice_level' && !wave.hidden) {
            var bands = evt.bands && evt.bands.length ? evt.bands : null;
            bars.forEach(function (b, i) {
              var v = bands ? bands[i] || 0 : (evt.level || 0);
              var h = 3 + Math.min(1, v * (bands ? 2.2 : 9)) * 11;
              b.style.height = h.toFixed(1) + 'px';
            });
          }
          if (evt.type === 'voice_partial' && evt.target === 'quick') {
            input.value = evt.text || ''; sync();
          }
          if (evt.type === 'voice_result' && evt.target === 'quick') {
            input.value = evt.text || ''; sync();
            input.focus();
          }
          if (evt.type === 'quick_shot') {
            setShot(evt.data_url, evt.base64);
            input.focus();
          }
          if (evt.type === 'quick_toast') {
            flashHint(evt.text || T('截图失败'), 'warn', 2600);
          }
        },
        focus: function () { input.focus(); syncVoice(); }
      };

      function boot() {
        if (!api()) { window.addEventListener('pywebviewready', boot, { once: true }); return; }
        api().get_state().then(function (st) {
          if (st && st.language && window.NexusI18n) window.NexusI18n.setLang(st.language);
          setHint(baseHint());
          sync();
        }).catch(function () { sync(); });
        setTimeout(function () { input.focus(); }, 60);
      }
      boot();
    })();
  </script>
</body>
</html>
